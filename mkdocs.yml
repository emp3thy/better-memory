site_name: better-memory
site_description: A local-first semantic + episodic memory manager for Claude Code.
site_url: https://emp3thy.github.io/better-memory/
repo_url: https://github.com/emp3thy/better-memory
repo_name: emp3thy/better-memory
edit_uri: edit/main/website/

docs_dir: website
site_dir: site

theme:
  name: material
  custom_dir: website/overrides
  font: false
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Configuration: configuration.md
  - Architecture: architecture.md
  - MCP tools: mcp-tools.md
  - Observation lifecycle: observation-lifecycle.md
  - Contributing: contributing.md

extra_css:
  - assets/css/brutalist.css
  - assets/css/pygments-brutalist.css

extra_javascript:
  - assets/js/install-tabs.js
