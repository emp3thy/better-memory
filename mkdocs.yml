site_name: better-memory
site_description: A local-first semantic + episodic memory manager for Claude Code.
site_url: https://emp3thy.github.io/better-memory/
repo_url: https://github.com/emp3thy/better-memory
repo_name: emp3thy/better-memory
edit_uri: edit/main/website/

docs_dir: website
site_dir: site

theme:
  name: material
  custom_dir: website/overrides
  font: false
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mermaid2:
      arguments:
        theme: 'base'
        themeVariables:
          fontFamily: '"JetBrains Mono", monospace'
          fontSize: '14px'
          primaryColor: '#f5f3ee'
          primaryTextColor: '#0d0d0d'
          primaryBorderColor: '#0d0d0d'
          lineColor: '#0d0d0d'
          secondaryColor: '#ff8c2b'
          tertiaryColor: '#ebe8e1'
          background: '#f5f3ee'
          edgeLabelBackground: '#f5f3ee'
          textColor: '#0d0d0d'
          stateBkg: '#f5f3ee'
          stateBorder: '#0d0d0d'
          labelColor: '#0d0d0d'
          altBackground: '#ebe8e1'
          cScale0: '#ff8c2b'
          cScale1: '#ebe8e1'
          cScale2: '#f5f3ee'

nav:
  - Home: index.md
  - Configuration: configuration.md
  - AgentCore setup: agentcore-setup.md
  - Architecture: architecture.md
  - MCP tools: mcp-tools.md
  - Observation lifecycle: observation-lifecycle.md
  - Contributing: contributing.md

extra_css:
  - assets/css/brutalist.css
  - assets/css/pygments-brutalist.css

extra_javascript:
  - assets/js/install-tabs.js
