[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "better-memory"
version = "0.1.0"
description = "Local-first AI memory system (MCP server + SQLite + sqlite-vec + Ollama embeddings)"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "mcp>=1",
    "sqlite-vec>=0.1",
    "httpx>=0.27",
    "pydantic>=2",
    "flask>=3",
    "markupsafe>=2",
]

[project.scripts]
better-memory = "better_memory.cli.main:main"

[project.optional-dependencies]
agentcore = [
    "boto3>=1.43.14",
    "botocore>=1.43.14",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-playwright",
    "ruff",
    "pyright",
    "boto3>=1.43.14",
    "botocore>=1.43.14",
]
docs = [
    "mkdocs-material",
    "mkdocs-mermaid2-plugin",
]

[tool.hatch.build.targets.wheel]
packages = ["better_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = [
    "integration: marks tests as integration tests (require external services)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["better_memory", "tests"]
exclude = ["**/.worktrees/**", "**/__pycache__"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
