<form id="observation-filter-form"
      class="filter-form"
      hx-get="{{ url_for('observations_panel') }}"
      hx-target="#observation-panel"
      hx-trigger="change from:select, change from:input">
  <label>Project
    <select name="project">
      <option value="">all</option>
      {% for p in projects %}
        <option value="{{ p }}">{{ p }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Status
    <select name="status">
      <option value="">all</option>
      <option value="active">active</option>
      <option value="archived">archived</option>
      <option value="consumed_without_reflection">consumed</option>
    </select>
  </label>
  <label>Outcome
    <select name="outcome">
      <option value="">all</option>
      <option value="success">success</option>
      <option value="failure">failure</option>
      <option value="neutral">neutral</option>
    </select>
  </label>
  <label>Component
    <input type="text" name="component" placeholder="(any)">
  </label>
  <button type="button"
          class="primary btn-synth"
          hx-post="{{ url_for('observations_synthesize') }}"
          hx-target="#observations-synth-banner"
          hx-swap="innerHTML"
          hx-disabled-elt="this">
    <span class="btn-idle">Run synthesis</span>
    <span class="btn-running">
      <span class="spinner"></span>
      Synthesising<span class="dots"><span>.</span><span>.</span><span>.</span></span>
    </span>
  </button>
  <div id="observations-synth-banner"></div>
</form>
